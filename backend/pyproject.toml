[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-agent-harness2"
version = "0.1.0"
description = "Applying recursive agent harnessing (Harness²) to cybersecurity: multi-domain benchmark evaluation & 8-component optimization"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
]
authors = [
    { name = "owl234", email = "321002609@qq.com" },
]
dependencies = []

[project.optional-dependencies]
render = ["openpyxl>=3.1,<4", "python-pptx>=1,<2"]
bridge = ["litellm[proxy]==1.95.0", "fastapi==0.139.2", "google-auth==2.56.3", "httpx>=0.27.0"]
responses-bridge = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "httpx>=0.27.0"]
ui = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]

[project.scripts]
sec-agent-harness2 = "sec_agent_harness2.cli.main:main"
sec-agent-harness2-run = "sec_agent_harness2.cli.run_sweep:main"
sec-agent-harness2-judge = "sec_agent_harness2.cli.judge:main"
sec-agent-harness2-report = "sec_agent_harness2.cli.report:main"
sec-agent-harness2-setup = "sec_agent_harness2.cli.setup:main"
sec-agent-harness2-check = "sec_agent_harness2.cli.check:main"
sec-agent-harness2-demo = "sec_agent_harness2.cli.demo:main"
sec-agent-harness2-bridge = "sec_agent_harness2.cli.bridge:main"
sec-agent-harness2-responses-bridge = "sec_agent_harness2.cli.responses_bridge:main"
sec-agent-harness2-ui = "sec_agent_harness2.cli.ui:main"
harness2 = "sec_agent_harness2.cli.main:main"
harness2-run = "sec_agent_harness2.cli.run_sweep:main"
harness2-judge = "sec_agent_harness2.cli.judge:main"
harness2-report = "sec_agent_harness2.cli.report:main"
harness2-setup = "sec_agent_harness2.cli.setup:main"
harness2-check = "sec_agent_harness2.cli.check:main"
harness2-demo = "sec_agent_harness2.cli.demo:main"
harness2-bridge = "sec_agent_harness2.cli.bridge:main"
harness2-responses-bridge = "sec_agent_harness2.cli.responses_bridge:main"
harness2-ui = "sec_agent_harness2.cli.ui:main"

[tool.setuptools.packages.find]
include = ["sec_agent_harness2*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", "dependencies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sec_agent_harness2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
