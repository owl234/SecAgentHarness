# The adapter mounts dependencies/claude/dist read-only at /opt/claude and supplies
# the model. The job-local Chat Completions proxy serves the benchmark judge
# separately.
harness:
  name: claude-harness
  import_path: "workbuddy_bench.agents.claude_harness_agent:ClaudeHarnessAgent"
  protocol: openai
  params:
    CLAUDE_MAX_TURNS: null
    CLAUDE_BIN_DIR: "/opt/claude"
