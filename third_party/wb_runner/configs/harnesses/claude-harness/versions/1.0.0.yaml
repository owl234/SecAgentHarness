# claude-harness 1.0.0 -- claude substrate baseline (clawgod-compatible CLI).
# The CLI is bind-mounted from dependencies/claude/dist (see install.claude);
# the version pin is enforced by claude_agent.install refusing any other build.
harness:
  params:
    CLAUDE_VERSION: "2.1.307"
  env:
    # Never let a task's own repo contribute config or instructions: a repo under
    # test could otherwise redefine the model or re-enable a denied tool.
    CLAUDE_CODE_DISABLE_PROJECT_CONFIG: "1"
